name: Apply DB Migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/db-migrate.yml'
  workflow_dispatch:

jobs:
  migrate_dry_run:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping migration dry-run: missing SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.guard.outputs.run == 'true' }}

      - uses: supabase/setup-cli@v1
        if: ${{ steps.guard.outputs.run == 'true' }}
        with:
          version: latest

      - name: Link project
        if: ${{ steps.guard.outputs.run == 'true' }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Dry-run migrations
        if: ${{ steps.guard.outputs.run == 'true' }}
        run: supabase db push --linked --include-all --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  migrate:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        id: guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping migration apply: missing SUPABASE_ACCESS_TOKEN and/or SUPABASE_PROJECT_REF."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: ${{ steps.guard.outputs.run == 'true' }}

      - uses: supabase/setup-cli@v1
        if: ${{ steps.guard.outputs.run == 'true' }}
        with:
          version: latest

      - name: Link project
        if: ${{ steps.guard.outputs.run == 'true' }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        if: ${{ steps.guard.outputs.run == 'true' }}
        run: supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
